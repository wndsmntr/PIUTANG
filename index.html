let QC='',FMT='pdf',LIM=40,PF=null,SF=null,PA=0,Q=[],tab='inv',flt='all',q='',area=localStorage.area||'',D0=iso(new Date(Date.now()-3*864e5)),D1=iso(new Date());

/* ---------- Akuntansi: angka rupiah, cicilan, jatuh tempo ---------- */
/* Rupiah ditulis tanpa sen: titik = pemisah ribuan, koma = desimal. "Rp. 300.000.00" / "300.000,00" / "300,000.00" / "300.000,-" => 300000.
   Singkatan: 300rb = 300.000, 1,5jt = 1.500.000. Salah baca OCR huruf O di antara angka dikoreksi menjadi 0. */
function parseRp(raw){
  let s=String(raw??'').trim();if(!s)return 0;
  s=s.replace(/(\d)[Oo]/g,'$10').replace(/(\d)[Oo]/g,'$10').replace(/[Oo](\d)/g,'0$1');
  s=s.toLowerCase().replace(/rp\.?|idr/g,'').replace(/\s+/g,'').replace(/(,|\/)-+$/,'');

  s=s.replace(/[^\d.,]/g,'');if(!s)return 0;
  const m=s.match(/^(.*)[.,](\d{1,2})$/),whole=m?m[1]:s,dec=m?+('0.'+m[2]):0;
  return Math.round(((+whole.replace(/\D/g,'')||0)+dec)*mult)}

/* ---------- Pembaca struk (OCR -> data) ---------- */
const num=s=>parseRp(s);
function parse(text){
  const L=text.split('\n').map(s=>s.trim()),r={issues:[]};let ci=-1,pt,pq,sum=0,qty=0,cnt=0;
  L.forEach((l,i)=>{let m;
    if(m=l.match(/^Pembeli\s+(.+)$/i)){r.name=m[1].replace(/\s+/g,' ').trim().toUpperCase();ci=i}
    else if(m=l.match(/^Pembayaran\s+(.+)$/i))r.pay=m[1].replace(/\s+/g,' ').trim();
    else if(m=l.match(/^Tanggal\s+(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/i))r.date=`${m[3]}-${m[2].padStart(2,0)}-${m[1].padStart(2,0)}`;
    else if(m=l.match(/^No\.?\s*Struk\s+(\S+)/i)){let t=m[1].toUpperCase();if(t.startsWith('UTP'))t='UTP'+t.slice(3).replace(/O/g,0).replace(/[IL]/g,1).replace(/S/g,5).replace(/B/g,8);r.n=t}
    else if(/^TOTAL\b/i.test(l)){const a=l.match(/\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{1,2})?|\d+(?:[.,]\d{1,2})?/g);pt=a&&num(a[a.length-1]);m=l.match(/(\d+)\s*QTY/i);if(m)pq=+m[1]}
    else if(m=l.match(/^([\d.,]+)\s*[x×]\s*(\d+)\s+([\d.,]+)$/i)){cnt++;sum+=num(m[3]);qty+=+m[2];if(num(m[1])*m[2]!=num(m[3]))r.issues.push('Baris barang tidak cocok: '+l)}
  });

const MON={jan:1,feb:2,mar:3,apr:4,mei:5,may:5,jun:6,jul:7,agu:8,agt:8,aug:8,sep:9,okt:10,oct:10,nov:11,des:12,dec:12};
const dmy=d=>{const[y,m,x]=d.split('-');return `${x}/${m}/${y}`};
function parseProof(t){const r={};let m,amt=0,first=0;
  for(const l of t.split('\n')){m=l.match(/(?:Rp|IDR)\.?\s*([\d.,]+)/i);if(m&&num(m[1])>=1000){first=first||num(m[1]);if(!amt&&/nominal|jumlah|total|amount/i.test(l))amt=num(m[1])}}
  r.amt=amt||first;
  if(m=t.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/))r.date=`${m[3]}-${m[2].padStart(2,0)}-${m[1].padStart(2,0)}`;
  else if(m=t.match(/(\d{1,2})\s+([A-Za-z]{3})[a-z]*\.?\s+(\d{4})/)){const k=MON[m[2].toLowerCase()];if(k)r.date=`${m[3]}-${String(k).padStart(2,0)}-${m[1].padStart(2,0)}`}
  r.bank=(t.match(/\b(BCA|BRI|BNI|MANDIRI|BSI|CIMB|PERMATA|DANAMON|BTN|JAGO|SEABANK|DANA|OVO|GOPAY|SHOPEEPAY|LINKAJA)\b/i)||[])[1]?.toUpperCase();
  r.ref=(t.match(/(?:No\.?\s*Ref\w*|Referensi|Ref\.?|ID\s*Transaksi)\s*[:.]?\s*([A-Z0-9]{6,})/i)||[])[1];return r}

/* Berkas yang dipilih bisa invoice, bukti transfer, atau keduanya. Isi form diisi otomatis. */
async function intake(files){
  if(!files.length)return;const items=[];
  for(let k=0;k<files.length;k++){const f=files[k];wait(1,`Membaca ${k+1} dari ${files.length}: ${f.name||'berkas'}…`);
    try{items.push({f,t:await readFile(f)})}catch(e){say(`${f.name||'Berkas'} tidak bisa dibaca: ${e.message}`)}}

  pr.forEach(y=>{const m=DB.inv.filter(i=>i.st=='b'&&y.pp.amt&&i.amt==y.pp.amt);m.length==1?Q.push(()=>payForm(m[0].n,y.f,y.pp)):lost.push(y.f.name||'berkas')});

async function shrink(f){
  if(f.type.startsWith('image/')){const bm=await createImageBitmap(f);
    for(const[mx,q]of[[1400,.75],[1200,.6],[1000,.5],[800,.5]]){const k=Math.min(1,mx/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=bm.width*k;c.height=bm.height*k;c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
      const b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));if(b.size<=600e3||mx==800)return{name:f.name,type:'image/jpeg',blob:b}}}
  if(f.size>600e3)throw new Error('Berkas terlalu besar (maksimal sekitar 600 KB). Gunakan foto atau kecilkan berkasnya.');
  return{name:f.name,type:f.type||'application/pdf',blob:f}}

const K=()=>Object.keys(DB.cus).sort();
function vCus(){const ks=K(),hot=ks.filter(n=>sum(DB.inv.filter(i=>i.name==n&&i.st=='b'),sisa)>0).length;
  return `<div class=hero><small>Total pelanggan</small><div class="big m">${ks.length}</div><div class=ln><span>${hot} masih punya tagihan</span></div></div>
  <label class=lb for=qc>Cari pelanggan</label><input id=qc class="in sr" placeholder="Nama atau alamat" value="${esc(QC)}" oninput="QC=this.value;$('#clist').innerHTML=clist()"><div id=clist>${clist()}</div>${acct()}`}
const clist=()=>{const l=K().map((n,k)=>[n,k]).filter(([n])=>!QC||(n+' '+(DB.cus[n].addr||'')).toLowerCase().includes(QC.toLowerCase()));
  return l.map(([n,k])=>{const c=DB.cus[n],t=sum(DB.inv.filter(i=>i.name==n&&i.st=='b'),sisa),cn=DB.inv.filter(i=>i.name==n).length;
    return `<div class=inv style="--ac:${t?'#a06a21':'#2c4e78'}" onclick="custMenu(${k})"><div class=row2><b class=nm>${esc(tc(n))}</b><b class=am>${t?rp(t):''}</b></div><div class=sb>${esc([c.addr,c.area].filter(Boolean).join(', '))||'-'}</div><div class=sb>${cn} invoice${c.term?' · tempo '+c.term+' hari':''}</div></div>`}).join('')||'<small>Pelanggan dibuat otomatis saat invoice disimpan.</small>'};
function custMenu(k){if(!ADMIN())return;const n=K()[k],c=DB.cus[n];
  $('#dlg').innerHTML=`<h2 style="margin:0">${esc(tc(n))}</h2><div class=sb>${esc([c.addr,c.area].filter(Boolean).join(', '))}</div>
  <button class="p blk" style="height:52px" onclick="custForm(${k})">Ubah pelanggan</button>
  <button class="s blk" style="color:#c0392b;border-color:#c0392b" onclick="delCus(${k})">Hapus pelanggan</button>
  <button class="s blk" style="border-color:transparent" onclick="$('#dlg').close()">Tutup</button>`;$('#dlg').showModal()}
function custForm(k){const n=K()[k],c=DB.cus[n];$('#dlg').innerHTML=`<h2 style="margin:0 0 8px">Ubah Pelanggan</h2><label>Nama</label><input class=in id="c_n" value="${esc(n)}" autocapitalize=characters><label>Alamat</label><input class=in id="c_a" value="${esc(c.addr)}"><label>Area / rute</label><input class=in id="c_r" value="${esc(c.area)}"><label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type=checkbox id="c_all" checked>Terapkan alamat dan area ke semua invoice pelanggan ini</label><div class=bar style="position:static"><button class=s onclick="$('#dlg').close()">Batal</button><button class=p onclick="saveCus(${k})">Simpan</button></div>`;$('#dlg').showModal()}
async function saveCus(k){if(!ADMIN())return;const o=K()[k],n=$('#c_n').value.trim().toUpperCase(),a=$('#c_a').value.trim(),r=$('#c_r').value.trim();
  if(!n)return say('Nama tidak boleh kosong.');if(n!=o&&DB.cus[n]&&!await ask(`Pelanggan ${n} sudah ada. Gabungkan?`))return;
  const b=FS.batch(),t=DB.cus[n]?.term??DB.cus[o]?.term??0;
  if(n!=o)b.delete(cus$().doc(idOf(o)));
  b.set(cus$().doc(idOf(n)),{nm:n,addr:a,area:r,term:t});
  DB.inv.forEach(i=>{if(i.name==o||i.name==n){const u={};if(i.name!=n)u.name=n;if($('#c_all').checked){if(a)u.addr=a;if(r)u.area=r}if(Object.keys(u).length)b.update(inv$().doc(idOf(i.n)),u)}});
  b.commit().catch(fail);$('#dlg').close()}
async function delCus(k){if(!ADMIN())return;const n=K()[k];if(await ask(`Hapus pelanggan ${n}? Invoice tidak ikut terhapus.`)){cus$().doc(idOf(n)).delete().catch(fail);$('#dlg').close()}}
const localHas=()=>{try{return(JSON.parse(localStorage.db||'null')?.inv||[]).length>0}catch(_){return false}};
const acct=()=>`<div class=card style="display:block;margin-top:18px"><div class=row2><span>Masuk sebagai</span><b>${ADMIN()?'Admin':'Petugas'}</b></div>${ADMIN()&&localHas()?`<button class="s blk" onclick="importLocal()">Unggah data dari perangkat ini ke cloud</button>`:''}<button class="s blk" onclick="AU.signOut()">Keluar</button></div>`;
async function importLocal(){const o=JSON.parse(localStorage.db||'null');if(!o)return;
  if(!await ask(`Unggah ${o.inv.length} invoice dan ${Object.keys(o.cus||{}).length} pelanggan dari perangkat ini ke cloud?`))return;wait(1,'Mengunggah data…');
  try{for(const i0 of o.inv){const i={...i0};if(!i.pays)i.pays=i.st&&i.st!='b'?[{d:i.date,m:i.st,a:i.amt,note:i.note||'',pk:i.proof?i.n:''}]:[];
      i.pays=i.pays.map((p,k)=>({...p,id:p.id||uid()+k}));i.term=i.term||0;i.src=i.src||0;delete i.st;delete i.proof;delete i.note;await inv$().doc(idOf(i.n)).set(i)}
    for(const[n,c]of Object.entries(o.cus||{}))await cus$().doc(idOf(n)).set({nm:n,addr:c.addr||'',area:c.area||'',term:c.term||0},{merge:true});
    const keys=await P('readonly',s=>s.getAllKeys());
    for(const k of keys){try{const v=await P('readonly',s=>s.get(k));if(v&&v.blob){const data=await b64(v.blob);if(data.length<=950000)await fil$().doc(idOf(k)).set({name:v.name||'',type:v.type||'',data})}}catch(_){}}
    localStorage.db_backup=localStorage.db;delete localStorage.db;wait(0);say('Data berhasil diunggah ke cloud.');render()
  }catch(e){wait(0);say('Gagal mengunggah: '+e.message)}}
function render(){if(tab=='lap'){need('pdf').catch(()=>{});need('xls').catch(()=>{})}$('#v').innerHTML={inv:vInv,lap:vLap,cus:vCus}[tab]();document.querySelectorAll('#tab button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab))}
document.querySelectorAll('#tab button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
$('#cam').onchange=$('#fil').onchange=e=>{const fs=[...e.target.files];e.target.value='';if(!busy())intake(fs)};$('#dlg').addEventListener('close',nextDraft);

/* ---------- Laporan PDF & Excel (A4 landscape) ---------- */
const jt=i=>dueOf(i)?sd(dueOf(i)):'-',pm=i=>i.st=='t'?'Transfer':i.st=='c'?'Cash':'Transfer + Cash',nm=i=>i.name+(paidOf(i)?` (cicil, total ${rp(i.amt)})`:'');
async function pdf(r){await need('pdf');
  const{jsPDF}=window.jspdf,doc=new jsPDF({orientation:'landscape',unit:'pt',format:'a4'}),W=842,title='LAPORAN PIUTANG - '+r.a.toUpperCase();
  doc.setFont('helvetica','bold').setFontSize(18).text(title,W/2,48,{align:'center'});doc.setFont('helvetica','normal').setFontSize(10).text(longDate(),W/2,64,{align:'center'});
  const T=(head,rows,tot,y,paid)=>{doc.setFont('helvetica','bold').setFontSize(11).text(head,36,y);
    const c={halign:'center'},cs=paid?{0:{...c,cellWidth:30},1:{...c,cellWidth:70},4:{...c,cellWidth:36},5:{halign:'right',cellWidth:80},6:{...c,cellWidth:80}}:{0:{...c,cellWidth:30},1:{...c,cellWidth:70},4:{...c,cellWidth:36},5:{...c,cellWidth:36},6:{halign:'right',cellWidth:80}};
    doc.autoTable({startY:y+6,margin:{left:36,right:36,bottom:40},theme:'grid',showFoot:'lastPage',
      head:[['NO','INVOICE','NAMA','ALAMAT','TGL',...(paid?['JUMLAH','PEMBAYARAN']:['JT','JUMLAH'])]],
      body:rows.map((i,k)=>paid?[k+1,i.n,i.name,i.addr,sd(i.date),rp(i.amt),pm(i)]:[k+1,i.n,nm(i),i.addr,sd(i.date),jt(i),rp(sisa(i))]),
      foot:[paid?[{content:tot,colSpan:5,styles:{halign:'left'}},rp(sum(rows)),'']:[{content:tot,colSpan:6,styles:{halign:'left'}},rp(sum(rows,sisa))]],
      styles:{fontSize:8,cellPadding:2.5,lineColor:60,lineWidth:.4,textColor:0},headStyles:{fillColor:[230,230,245],textColor:0,halign:'center'},footStyles:{fillColor:[240,240,240],textColor:0},columnStyles:cs});
    return doc.lastAutoTable.finalY};
  let y=T('Belum bayar',r.u,`TOTAL BELUM BAYAR (${r.u.length} invoice)`,92,0);
  if(y+60>555){doc.addPage();y=14}
  y=T('Sudah lunas',r.p,`TOTAL LUNAS (${r.p.length} invoice)`,y+22,1);
  if(y+40>555){doc.addPage();y=20}
  doc.setFont('helvetica','normal').setFontSize(9).text(doc.splitTextToSize(summary(r),770),36,y+16);
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8).setTextColor(90).text(title,36,576);doc.text(`Halaman ${i} dari ${n}`,W-36,576,{align:'right'})}
  return doc.output('blob')}
async function xlsx(r){await need('xls');
  const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Laporan',{pageSetup:{paperSize:9,orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0},views:[{showGridLines:false}]});
  ws.columns=[6,14,30,26,8,18,16].map(width=>({width}));
  const bd={style:'thin',color:{argb:'FF444444'}},B={top:bd,left:bd,bottom:bd,right:bd},fill=c=>({type:'pattern',pattern:'solid',fgColor:{argb:c}}),RP='"Rp "#,##0',dt=s=>new Date(s+'T00:00:00Z');
  ws.addRow(['LAPORAN PIUTANG - '+r.a.toUpperCase()]);ws.mergeCells('A1:G1');ws.getRow(1).font={bold:true,size:14};ws.getRow(1).alignment={horizontal:'center'};
  ws.addRow([longDate()]);ws.mergeCells('A2:G2');ws.getRow(2).alignment={horizontal:'center'};ws.addRow([]);
  const S=(head,rows,tot,paid)=>{ws.addRow([head]).font={bold:true};const ac=paid?6:7,AL=paid?'F':'G';
    ws.addRow(['NO','INVOICE','NAMA','ALAMAT','TGL',...(paid?['JUMLAH','PEMBAYARAN']:['JT','JUMLAH'])]).eachCell(c=>{c.font={bold:true};c.fill=fill('FFE6E6F5');c.border=B;c.alignment={horizontal:'center'}});
    const first=ws.rowCount+1;
    rows.forEach((i,k)=>{const w=ws.addRow(paid?[k+1,i.n,i.name,i.addr,dt(i.date),i.amt,pm(i)]:[k+1,i.n,nm(i),i.addr,dt(i.date),dueOf(i)?dt(dueOf(i)):'-',sisa(i)]);
      w.eachCell(c=>c.border=B);w.getCell(5).numFmt='d/m';w.getCell(ac).numFmt=RP;if(!paid)w.getCell(6).numFmt='d/m';[1,2,5,paid?7:6].forEach(c=>w.getCell(c).alignment={horizontal:'center'})});
    const val=rows.length?{formula:`SUM(${AL}${first}:${AL}${first+rows.length-1})`,result:paid?sum(rows):sum(rows,sisa)}:0,
      t=ws.addRow(paid?[tot,'','','','',val,'']:[tot,'','','','','',val]);
    ws.mergeCells(`A${t.number}:${paid?'E':'F'}${t.number}`);t.eachCell(c=>{c.font={bold:true};c.fill=fill('FFF0F0F0');c.border=B});t.getCell(ac).numFmt=RP;ws.addRow([])};
  S('Belum bayar',r.u,`TOTAL BELUM BAYAR (${r.u.length} invoice)`,0);S('Sudah lunas',r.p,`TOTAL LUNAS (${r.p.length} invoice)`,1);
  const s=ws.addRow([summary(r)]);ws.mergeCells(`A${s.number}:G${s.number}`);s.height=30;s.alignment={wrapText:true,vertical:'top'};
  return new Blob([await wb.xlsx.writeBuffer()],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
async function saveOut(blob,name){const f=blob instanceof File?blob:new File([blob],name,{type:blob.type});
  if(navigator.canShare?.({files:[f]})){try{await navigator.share({files:[f],title:name});return}catch(e){if(e.name=='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;a.click()}
const fname=(r,k)=>`Laporan-${r.a.replace(/\W+/g,'-')}-${iso(new Date())}.${k}`;
const waText=r=>{const L=[`*LAPORAN PIUTANG - ${r.a.toUpperCase()}*`,longDate(),'',`*Belum bayar (${r.u.length})* ${rp(sum(r.u,sisa))}`,
  ...r.u.slice(0,10).map((i,k)=>`${k+1}. ${nf(i.n)} ${tc(i.name)} ${rp(sisa(i))}${dueOf(i)?' (JT '+sd(dueOf(i))+')':''}`)];
  if(r.u.length>10)L.push(`…dan ${r.u.length-10} lainnya`);L.push('',`*Lunas (${r.p.length})* ${rp(sum(r.p))}`,'',summary(r));return L.join('\n')};
function shareSheet(){const r=build(area,D0,D1);
  $('#dlg').innerHTML=`<h2 style="margin:0 0 4px">Bagikan laporan</h2><small>${esc(r.a)} · ${r.u.length+r.p.length} invoice · A4 landscape</small>
  <label style="display:block;margin-top:12px">Format</label><div class=seg>${[['pdf','PDF'],['xlsx','Excel'],['both','Keduanya']].map(([k,t])=>`<button class="${FMT==k?'on':''}" onclick="FMT='${k}';shareSheet()">${t}</button>`).join('')}</div>
  <button class="p blk" style="height:54px" onclick="makeFiles()">Buat laporan</button>
  <button class="s blk" style="border-color:transparent" onclick="$('#dlg').close()">Batal</button>`;
  if(!$('#dlg').open)$('#dlg').showModal()}
let FILES=[],REP=null;
async function makeFiles(){$('#dlg').close();REP=build(area,D0,D1);const kinds=FMT=='both'?['pdf','xlsx']:[FMT];wait(1,'Menyiapkan laporan…');
  try{FILES=[];for(const k of kinds){const b=k=='pdf'?await pdf(REP):await xlsx(REP);FILES.push(new File([b],fname(REP,k),{type:b.type}))}
    wait(0);
    $('#dlg').innerHTML=`<h2 style="margin:0 0 4px">Laporan siap</h2>${FILES.map(f=>`<div class=sb>📄 ${esc(f.name)} · ${Math.max(1,Math.round(f.size/1024))} KB</div>`).join('')}
    <button class="p blk" style="height:54px;background:#1f8f55;border-color:#1f8f55" onclick="sendFiles('wa')">Kirim ke WhatsApp</button>
    <button class="s blk" style="height:54px" onclick="sendFiles('other')">Simpan atau bagikan lainnya</button>
    <button class="s blk" style="border-color:transparent" onclick="$('#dlg').close()">Tutup</button>`;$('#dlg').showModal()
  }catch(e){wait(0);say('Gagal membuat laporan: '+e.message)}}
/* dipanggil langsung dari ketukan tombol, supaya menu bagikan iPhone diizinkan */
async function sendFiles(mode){
  const go=()=>navigator.canShare?.({files:FILES})?navigator.share({files:FILES,title:'Laporan Piutang '+REP.a,text:mode=='wa'?waText(REP):undefined}):Promise.reject({name:'NoShare'});
  try{await go();return}catch(e){if(e.name=='AbortError')return}
  for(const f of FILES){const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}
  if(mode=='wa')window.open('https://wa.me/?text='+encodeURIComponent(waText(REP)),'_blank')}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
navigator.storage?.persist?.();
if(/iPhone|iPad/.test(navigator.userAgent)&&!navigator.standalone&&!localStorage.tip){localStorage.tip=1;setTimeout(()=>say('Pasang sebagai aplikasi: ketuk tombol Bagikan di Safari, lalu Tambah ke Layar Utama.'),2000)}
async function boot(){render();
  if(!window.FB_CONFIG||!FB_CONFIG.apiKey||/^ISI/.test(FB_CONFIG.apiKey)){showLogin('Firebase belum diatur. Isi file config.js dengan data proyek Firebase Anda (lihat PANDUAN-FIREBASE.md).',1);return}
  try{await need('fb')}catch(e){showLogin('Tidak bisa memuat Firebase. Periksa koneksi internet.',1);return}
  firebase.initializeApp(FB_CONFIG);AU=firebase.auth();FS=firebase.firestore();FS.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  AU.onAuthStateChanged(u=>{UNSUB.forEach(f=>f());UNSUB=[];
    if(!u){ROLE='';DB.inv=[];DB.cus={};render();showLogin();return}
    ROLE=(u.email||'').startsWith('admin@')?'admin':'petugas';hideLogin();
    UNSUB.push(inv$().onSnapshot(sn=>{DB.inv=sn.docs.map(d=>{const i=d.data();i.pays=i.pays||[];i.term=i.term||0;calc(i);return i});refresh()},e=>say('Sinkronisasi gagal: '+e.message)));
    UNSUB.push(cus$().onSnapshot(sn=>{const c={};sn.docs.forEach(d=>{const x=d.data();c[x.nm||d.id]=x});DB.cus=c;refresh()},()=>{}));
    render()})}
function showLogin(msg,fatal){$('#login').style.display='block';const e=$('#lg_err');e.style.display=msg?'block':'none';e.textContent=msg||'';$('#lg_btn').style.display=fatal?'none':'block';$('#lg_code').style.display=fatal?'none':'block'}
function hideLogin(){$('#login').style.display='none';$('#lg_code').value=''}
async function login(){const c=$('#lg_code').value;if(!c)return;$('#lg_btn').disabled=true;$('#lg_btn').textContent='Memeriksa…';
  const go=e=>AU.signInWithEmailAndPassword(e+'@piutang.app',c);
  try{await go('admin')}catch(e1){try{await go('petugas')}catch(e2){showLogin(e2.code=='auth/network-request-failed'?'Tidak ada koneksi internet.':e2.code=='auth/too-many-requests'?'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.':'Kode salah.')}}
  $('#lg_btn').disabled=false;$('#lg_btn').textContent='Masuk'}
boot();
</script></body></html>
